<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Customer Registry Book - Healthy Home Foods</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            },
            tealbrand: {
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Axios for API Calls -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-teal-500 selection:text-slate-900">

  <!-- Main App Shell -->
  <div id="app" class="flex w-full min-h-screen">
    
    <!-- Sidebar Navigation (Desktop) -->
    <aside class="hidden md:flex flex-col w-64 bg-slate-950 border-r border-slate-800 p-4 fixed h-full z-20">
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 px-3 py-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-slate-950 font-bold text-xl shadow-lg shadow-teal-500/20">
          🍱
        </div>
        <div>
          <h1 class="font-bold text-base text-slate-100 leading-tight">Healthy Home Foods</h1>
          <p class="text-xs text-teal-400 font-medium">Customer Registry Book</p>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="flex-1 space-y-1 overflow-y-auto">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-chart-pie text-base w-5 text-center"></i>
          <span>Dashboard</span>
        </button>
        <button onclick="switchTab('customers')" id="nav-customers" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-users text-base w-5 text-center"></i>
          <span>Customer CRM</span>
        </button>
        <button onclick="switchTab('subscriptions')" id="nav-subscriptions" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-calendar-plus text-base w-5 text-center"></i>
          <span>New Subscription</span>
        </button>
        <button onclick="switchTab('delivery')" id="nav-delivery" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-truck-ram-box text-base w-5 text-center"></i>
          <span>Daily Deliveries</span>
        </button>
        <button onclick="switchTab('ledger')" id="nav-ledger" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-wallet text-base w-5 text-center"></i>
          <span>Ledger & Payments</span>
        </button>
        <button onclick="switchTab('expenses')" id="nav-expenses" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-receipt text-base w-5 text-center"></i>
          <span>Expenses</span>
        </button>
        <button onclick="switchTab('inventory')" id="nav-inventory" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-boxes-stacked text-base w-5 text-center"></i>
          <span>Stock & Inventory</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-sliders text-base w-5 text-center"></i>
          <span>Settings</span>
        </button>
      </nav>

      <!-- Connection Status Card -->
      <div class="mt-auto pt-4 border-t border-slate-800">
        <div onclick="openConfigModal()" class="p-3 bg-slate-900 border border-slate-800 rounded-xl cursor-pointer hover:border-slate-700 transition flex items-center gap-3">
          <div id="status-indicator" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-lg shadow-emerald-500/50"></div>
          <div>
            <p id="status-title" class="text-xs font-semibold text-slate-200">Cloud API Live</p>
            <p id="status-url" class="text-[10px] text-slate-400 truncate max-w-[140px]">onrender.com</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile Bottom Navigation Bar -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-slate-950 border-t border-slate-800 z-30 flex items-center justify-around px-2">
      <button onclick="switchTab('dashboard')" id="mobile-nav-dashboard" class="mobile-nav flex flex-col items-center gap-1 text-slate-400 text-xs font-medium">
        <i class="fa-solid fa-chart-pie text-lg"></i>
        <span>Home</span>
      </button>
      <button onclick="switchTab('customers')" id="mobile-nav-customers" class="mobile-nav flex flex-col items-center gap-1 text-slate-400 text-xs font-medium">
        <i class="fa-solid fa-users text-lg"></i>
        <span>CRM</span>
      </button>
      <button onclick="switchTab('delivery')" id="mobile-nav-delivery" class="mobile-nav flex flex-col items-center gap-1 text-slate-400 text-xs font-medium">
        <i class="fa-solid fa-truck text-lg"></i>
        <span>Delivery</span>
      </button>
      <button onclick="switchTab('ledger')" id="mobile-nav-ledger" class="mobile-nav flex flex-col items-center gap-1 text-slate-400 text-xs font-medium">
        <i class="fa-solid fa-wallet text-lg"></i>
        <span>Ledger</span>
      </button>
      <button onclick="switchTab('expenses')" id="mobile-nav-expenses" class="mobile-nav flex flex-col items-center gap-1 text-slate-400 text-xs font-medium">
        <i class="fa-solid fa-receipt text-lg"></i>
        <span>Expenses</span>
      </button>
    </div>

    <!-- Main Content Workspace -->
    <main class="flex-1 md:ml-64 pb-20 md:pb-8 min-w-0">
      
      <!-- Top Header Bar -->
      <header class="sticky top-0 z-10 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between">
        <div>
          <h2 id="page-title" class="text-xl font-bold text-slate-100">Dashboard Overview</h2>
          <p id="page-subtitle" class="text-xs text-slate-400">Live operational & financial metrics</p>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-slate-100 flex items-center justify-center text-sm transition">
            <i class="fa-solid fa-moon"></i>
          </button>
          <button onclick="openConfigModal()" class="px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-semibold text-teal-400 hover:bg-slate-700 transition">
            <i class="fa-solid fa-wifi mr-1"></i> API Server
          </button>
        </div>
      </header>

      <!-- Dynamic Views Container -->
      <div class="p-6">
        <div id="view-container"></div>
      </div>
    </main>

  </div>

  <!-- Toast Element -->
  <div id="toast" class="fixed bottom-20 md:bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none bg-slate-800 border border-teal-500 text-slate-100 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
    <i class="fa-solid fa-circle-check text-teal-400 text-lg"></i>
    <span id="toast-text" class="text-sm font-medium">Notification message</span>
  </div>

  <!-- Global Modal Dialog Container -->
  <div id="modal-container" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modal-content" class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 custom-shadow relative max-h-[90vh] overflow-y-auto">
      <!-- Modal Form content injected via JS -->
    </div>
  </div>

  <!-- Application Modular Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/customers.js"></script>
  <script src="js/components/subscriptions.js"></script>
  <script src="js/components/deliveries.js"></script>
  <script src="js/components/ledger.js"></script>
  <script src="js/components/expenses.js"></script>
  <script src="js/components/inventory.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
